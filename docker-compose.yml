services:
  omni-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omni-monitor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
