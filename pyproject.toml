[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omni-monitor"
version = "0.2.0"
description = "Pluggable multi-scenario asset & event monitor with SQLite, FastAPI, and Google FCM push"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "firebase-admin>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
omni-monitor = "omni_monitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_monitor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
